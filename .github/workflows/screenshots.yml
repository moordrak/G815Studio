name: screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/UI/**']

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: dotnet publish G815Studio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Snimke zaslona
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "publish\G815Studio.exe" -ArgumentList "--screenshots","docs\screenshots" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "Isteklo vrijeme" }
          Get-ChildItem docs\screenshots
      - name: Spremi slike u repozitorij
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Snimke zaslona za README [skip ci]"
            git pull --rebase
            git push
          }

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: >
          dotnet publish G815Studio.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: G815Studio
          path: publish/G815Studio.exe
      - name: Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" publish/G815Studio.exe --clobber
          else
            gh release create "$TAG" publish/G815Studio.exe --title "G815 Studio $TAG" \
              --notes "Samostalni G815Studio.exe za Windows 10/11 (x64)."
          fi

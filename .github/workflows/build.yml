name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# isti tag/grana ne smije imati dva builda u isto vrijeme (inače si međusobno brišu exe na releaseu)
concurrency:
  group: build-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: >
          dotnet publish SVITAC.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: SVITAC
          path: publish/SVITAC.exe
      - name: Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          # do 3 pokušaja (GitHub povremeno vrati 502)
          for i in 1 2 3; do
            gh release upload "$TAG" publish/SVITAC.exe --clobber && exit 0
            echo "Pokušaj $i nije uspio, ponavljam za 10 s…"
            sleep 10
          done
          exit 1
